  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Rebound — Your whole front desk is one WhatsApp chat<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\n<style>\n/* ============ TOKENS ============ */\n:root{\n  --bg:#EFE8DE;\n  --bg-soft:#F6F1E9;\n  --surface:#FDFBF7;\n  --ink:#132A22;\n  --muted:#5C6B62;\n  --line:rgba(19,42,34,.13);\n  --line-strong:rgba(19,42,34,.3);\n  --accent:#1BA84F;\n  --accent-deep:#0E5D2F;\n  --accent-soft:rgba(27,168,79,.12);\n  --gold:#B4770F;\n  --bad:#B3452F;\n  --bad-soft:rgba(179,69,47,.12);\n  --bubble-out:#D9FDD3;\n  --bubble-in:#FFFFFF;\n  --bubble-ink:#0F211A;\n  --chat-bg:#E5DDD1;\n  --phone-frame:#101613;\n  --shadow:0 24px 60px -24px rgba(19,42,34,.35);\n  --tick:#34B7F1;\n  --btn-ink:#06210f;\n  --you:#C77A16;\n}\n@media (prefers-color-scheme: dark){\n  :root{\n    --bg:#0B141A; --bg-soft:#0F1B22; --surface:#15242D;\n    --ink:#E9EDEF; --muted:#8696A0;\n    --line:rgba(233,237,239,.12); --line-strong:rgba(233,237,239,.28);\n    --accent:#25D366; --accent-deep:#7BE3A4; --accent-soft:rgba(37,211,102,.13);\n    --gold:#E4B04E;\n    --bad:#E07A64; --bad-soft:rgba(224,122,100,.13);\n    --bubble-out:#005C4B; --bubble-in:#202C33; --bubble-ink:#E9EDEF;\n    --chat-bg:#0B141A; --phone-frame:#2A3942;\n    --shadow:0 24px 60px -24px rgba(0,0,0,.7);\n    --you:#E8A33D;\n  }\n}\n:root[data-theme=\"light\"]{\n  --bg:#EFE8DE; --bg-soft:#F6F1E9; --surface:#FDFBF7;\n  --ink:#132A22; --muted:#5C6B62;\n  --line:rgba(19,42,34,.13); --line-strong:rgba(19,42,34,.3);\n  --accent:#1BA84F; --accent-deep:#0E5D2F; --accent-soft:rgba(27,168,79,.12);\n  --gold:#B4770F;\n  --bad:#B3452F; --bad-soft:rgba(179,69,47,.12);\n  --bubble-out:#D9FDD3; --bubble-in:#FFFFFF; --bubble-ink:#0F211A;\n  --chat-bg:#E5DDD1; --phone-frame:#101613;\n  --shadow:0 24px 60px -24px rgba(19,42,34,.35);\n  --you:#C77A16;\n}\n:root[data-theme=\"dark\"]{\n  --bg:#0B141A; --bg-soft:#0F1B22; --surface:#15242D;\n  --ink:#E9EDEF; --muted:#8696A0;\n  --line:rgba(233,237,239,.12); --line-strong:rgba(233,237,239,.28);\n  --accent:#25D366; --accent-deep:#7BE3A4; --accent-soft:rgba(37,211,102,.13);\n  --gold:#E4B04E;\n  --bad:#E07A64; --bad-soft:rgba(224,122,100,.13);\n  --bubble-out:#005C4B; --bubble-in:#202C33; --bubble-ink:#E9EDEF;\n  --chat-bg:#0B141A; --phone-frame:#2A3942;\n  --shadow:0 24px 60px -24px rgba(0,0,0,.7);\n  --you:#E8A33D;\n}\n\n/* ============ BASE ============ */\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{\n  margin:0; background:var(--bg); color:var(--ink);\n  font:16px/1.65 -apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,\"Helvetica Neue\",Arial,sans-serif;\n  -webkit-font-smoothing:antialiased; overflow-x:hidden;\n}\nh1,h2,h3{margin:0; letter-spacing:-.02em; text-wrap:balance; line-height:1.1}\np{margin:0}\na{color:inherit}\n.eyebrow{\n  display:inline-flex; align-items:center; gap:8px;\n  font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;\n  color:var(--accent-deep);\n}\n.eyebrow::before{content:\"\"; width:22px; height:2px; background:var(--accent); border-radius:2px}\n.num{font-variant-numeric:tabular-nums}\n.wrap{max-width:1160px; margin:0 auto; padding:0 24px}\n\n/* word-by-word heading reveal */\nh2.reveal .w{display:inline-block; overflow:hidden; vertical-align:top; padding-bottom:.08em; margin-bottom:-.08em}\nh2.reveal .wi{display:inline-block; transform:translateY(115%); transition:transform .7s cubic-bezier(.2,.8,.2,1)}\nh2.reveal.on .wi{transform:none}\n\n/* ---- WhatsApp-style speech tails (every bubble outside the phone demos) ---- */\n.tl-r,.tl-l{position:relative}\n.tl-r::before,.tl-l::before{\n  content:\"\"; position:absolute; bottom:0; width:14px; height:16px; background:inherit;\n}\n.tl-r::before{right:-9px; clip-path:path('M0 0 C2 6 6 12 14 16 L0 16 Z')}\n.tl-l::before{left:-9px; clip-path:path('M14 0 C12 6 8 12 0 16 L14 16 Z')}\n\n/* drifting background chat bubbles — identical to the convo bubbles, just empty */\n.bub{\n  position:absolute; pointer-events:none; z-index:0; box-shadow:var(--shadow); opacity:.45;\n  display:none; /* background bubbles hidden for now — delete this line to bring them back */\n}\n.bub.green{background:var(--bubble-out); border-radius:18px 18px 6px 18px}\n.bub.plain{background:var(--bubble-in); border-radius:18px 18px 18px 6px}\n\n/* ============ NAV ============ */\n.nav{\n  position:fixed; inset:0 0 auto 0; z-index:50;\n  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);\n  background:color-mix(in srgb, var(--bg) 80%, transparent);\n  border-bottom:1px solid transparent; transition:border-color .3s;\n}\n.nav.scrolled{border-color:var(--line)}\n.nav-in{max-width:1160px; margin:0 auto; padding:13px 24px; display:flex; align-items:center; gap:22px}\n.logo{display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; letter-spacing:-.02em; text-decoration:none}\n.nav-links{display:flex; gap:20px; margin-left:auto; font-size:14px; font-weight:600}\n.nav-links a{text-decoration:none; color:var(--muted); transition:color .2s}\n.nav-links a:hover,.nav-links a:focus-visible{color:var(--ink)}\n.theme-btn{\n  background:none; border:1.5px solid var(--line); color:var(--muted); cursor:pointer;\n  width:38px; height:38px; border-radius:50%; display:grid; place-items:center; flex:none;\n  transition:border-color .2s, color .2s;\n}\n.theme-btn:hover{border-color:var(--accent); color:var(--ink)}\n.theme-btn svg{width:17px; height:17px}\n.btn{\n  display:inline-flex; align-items:center; gap:9px;\n  background:var(--accent); color:var(--btn-ink); border:none; cursor:pointer;\n  font-weight:700; font-size:15px; padding:12px 22px; border-radius:999px;\n  text-decoration:none; transition:transform .18s, box-shadow .18s;\n  box-shadow:0 8px 24px -10px var(--accent);\n}\n.btn:hover{transform:translateY(-2px); box-shadow:0 14px 30px -10px var(--accent)}\n.btn:focus-visible,a:focus-visible,summary:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:3px}\n.btn.small{padding:9px 18px; font-size:14px}\n.btn.ghost{background:transparent; color:var(--ink); box-shadow:none; border:1.5px solid var(--line)}\n.btn.ghost:hover{border-color:var(--accent); box-shadow:none}\n\n/* ============ HERO ============ */\n.hero{min-height:94vh; display:flex; align-items:center; padding:120px 0 60px; position:relative; overflow:hidden}\n.hero-grid{display:grid; grid-template-columns:1.12fr .88fr; gap:60px; align-items:center; position:relative; z-index:1}\n.hero h1{font-size:clamp(40px,5.2vw,68px); font-weight:800; letter-spacing:-.035em}\n.hero h1 em{font-style:normal; color:var(--accent-deep)}\n.hero-sub{margin:22px 0 30px; max-width:52ch; font-size:18px; color:var(--muted)}\n.hero-ctas{display:flex; gap:14px; flex-wrap:wrap; align-items:center}\n.hero-zero{margin-top:32px; display:flex; gap:20px; flex-wrap:wrap; font-size:14px; font-weight:600; color:var(--muted)}\n.hero-zero span{display:inline-flex; align-items:center; gap:7px}\n.hero-zero b{color:var(--accent-deep)}\n.hero-phone-wrap{display:flex; flex-direction:column; align-items:center; gap:14px}\n.hero-note{font-size:15px; color:var(--muted); text-align:center; max-width:280px}\n.scroll-cue{\n  position:absolute; bottom:22px; left:50%; transform:translateX(-50%);\n  font-size:12px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--muted);\n  display:flex; flex-direction:column; align-items:center; gap:8px;\n}\n.scroll-cue::after{\n  content:\"\"; width:1.5px; height:34px; background:linear-gradient(var(--accent),transparent);\n  animation:drip 1.8s ease-in-out infinite;\n}\n@keyframes drip{0%,100%{transform:scaleY(.4); transform-origin:top}50%{transform:scaleY(1)}}\n\n/* ============ PHONE (shared) ============ */\n.phone{\n  width:300px; background:var(--phone-frame); border-radius:42px; padding:9px;\n  box-shadow:var(--shadow), inset 0 0 0 1.5px rgba(255,255,255,.09);\n  position:relative; flex:none;\n}\n.phone::before{\n  content:\"\"; position:absolute; top:18px; left:50%; transform:translateX(-50%);\n  width:88px; height:22px; background:var(--phone-frame); border-radius:99px; z-index:4;\n}\n.screen{\n  border-radius:34px; overflow:hidden; background:var(--chat-bg);\n  display:flex; flex-direction:column; position:relative; height:100%;\n}\n.screen::before{\n  content:\"\"; position:absolute; inset:0; opacity:.5; pointer-events:none; z-index:0;\n  background-image:radial-gradient(color-mix(in srgb, var(--ink) 7%, transparent) 1px, transparent 1.5px);\n  background-size:22px 22px;\n}\n.wa-head{\n  background:var(--surface); padding:30px 14px 9px; display:flex; align-items:center; gap:10px;\n  border-bottom:1px solid var(--line); position:relative; z-index:3;\n}\n.wa-head .avatar{width:34px; height:34px; border-radius:50%; background:var(--accent); display:grid; place-items:center; flex:none}\n.wa-head .avatar svg{width:19px; height:19px}\n.wa-head .wtitle{line-height:1.2; min-width:0}\n.wa-head .wtitle b{font-size:14.5px; display:block}\n.wa-head .wtitle span{font-size:11px; color:var(--accent)}\n.wa-head .dots{margin-left:auto; color:var(--muted); font-weight:800; letter-spacing:2px}\n.chat{\n  flex:1; padding:12px 11px; display:flex; flex-direction:column;\n  overflow:hidden; justify-content:flex-end; position:relative; z-index:1; min-height:0;\n}\n.bubble{\n  max-width:86%; padding:8px 11px 6px; border-radius:12px; position:relative;\n  font-size:13px; line-height:1.45; color:var(--bubble-ink);\n  box-shadow:0 1px 1px rgba(0,0,0,.08); width:fit-content; margin:4px 0; flex:none;\n  animation:pop .4s cubic-bezier(.3,1.3,.5,1) both;\n}\n.bubble.in{background:var(--bubble-in); border-top-left-radius:3px; align-self:flex-start}\n.bubble.out{background:var(--bubble-out); border-top-right-radius:3px; align-self:flex-end}\n.bubble .meta{\n  display:flex; justify-content:flex-end; gap:4px; align-items:center;\n  font-size:10px; color:color-mix(in srgb, var(--bubble-ink) 55%, transparent); margin-top:2px;\n}\n.bubble .ticks{color:var(--tick); font-weight:700; letter-spacing:-.12em}\n.bubble b{font-weight:700}\n.bubble .doc{\n  display:flex; align-items:center; gap:9px; background:color-mix(in srgb, var(--bubble-ink) 7%, transparent);\n  border-radius:9px; padding:8px 10px; margin-top:7px; font-size:12px; font-weight:600;\n}\n.bubble .doc .dicon{\n  width:30px; height:30px; border-radius:7px; background:#D64541; color:#fff;\n  display:grid; place-items:center; font-size:9px; font-weight:800; flex:none;\n}\n.wa-btns{display:flex; flex-direction:column; margin-top:9px; border-top:1px solid rgba(0,0,0,.08)}\n.wa-btn{\n  display:flex; align-items:center; justify-content:center; gap:6px;\n  padding:10px 8px; min-height:44px;\n  border:none; background:transparent;\n  color:#25D366; font-size:12px; font-weight:600; text-align:center;\n  border-bottom:1px solid rgba(0,0,0,.08);\n}\n.wa-btn:last-child{border-bottom:none;}\n.wa-btn::before{content:\"↩\"; font-size:13px; color:#25D366; flex-none;}\n[data-theme=\"dark\"] .wa-btns{border-top-color:rgba(255,255,255,.08)}\n[data-theme=\"dark\"] .wa-btn{border-bottom-color:rgba(255,255,255,.08)}\n.daychip{\n  align-self:center; margin:9px auto 5px; width:fit-content; flex:none;\n  background:color-mix(in srgb, var(--surface) 88%, transparent);\n  color:var(--muted); font-size:10.5px; font-weight:700; letter-spacing:.06em;\n  padding:4px 12px; border-radius:8px; box-shadow:0 1px 1px rgba(0,0,0,.06);\n  text-transform:uppercase; animation:pop .4s both;\n}\n.typing-b{display:flex; gap:3px; padding:5px 3px; align-items:center}\n.typing-b i{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--bubble-ink) 40%,transparent);animation:blink 1.2s infinite}\n.typing-b i:nth-child(2){animation-delay:.2s}.typing-b i:nth-child(3){animation-delay:.4s}\n@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}\n@keyframes pop{from{opacity:0; transform:translateY(12px) scale(.94)}to{opacity:1; transform:none}}\n.wa-input{display:flex; align-items:center; gap:7px; padding:8px 9px 12px; position:relative; z-index:2}\n.wa-field{\n  flex:1; background:var(--surface); border-radius:999px; padding:9px 14px;\n  font-size:13px; line-height:1.3; min-height:36px; display:flex; align-items:center;\n  color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.07); min-width:0;\n}\n.wa-field .ph{color:var(--muted); opacity:.8}\n.wa-field .txt{white-space:nowrap; overflow:hidden}\n.wa-field .caret{\n  display:inline-block; width:1.5px; height:15px; background:var(--accent);\n  margin-left:1px; animation:caret 1s steps(1) infinite; flex:none;\n}\n@keyframes caret{50%{opacity:0}}\n.wa-send{\n  width:38px; height:38px; border-radius:50%; background:var(--accent); flex:none;\n  display:grid; place-items:center; color:var(--btn-ink); transition:transform .2s;\n}\n.wa-send.pulse{transform:scale(1.12)}\n.wa-send svg{width:17px; height:17px}\n\n/* ============ LEAKS ============ */\n.leaks{padding:110px 0 90px; position:relative; overflow:hidden}\n.leaks h2, .sec h2{font-size:clamp(32px,4vw,50px); font-weight:800; letter-spacing:-.03em; margin:14px 0 16px}\n.sec-sub{color:var(--muted); font-size:17px; max-width:58ch}\n.leak-row{display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-top:52px; position:relative; z-index:1}\n.leak{\n  background:var(--surface); border:1px solid var(--line); border-radius:20px;\n  padding:26px 24px 28px; opacity:0; transform:translateY(46px);\n  transition:opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1);\n}\n.leak.on{opacity:1; transform:none}\n.leak .rb{\n  display:inline-block; background:var(--bubble-in); color:var(--bubble-ink);\n  border-radius:14px; padding:8px 14px; font-size:15px; font-weight:800;\n  box-shadow:0 1px 2px rgba(0,0,0,.1); margin-bottom:16px; margin-left:9px;\n}\n.leak .rb em{font-style:normal; color:var(--accent-deep)}\n.leak p{font-size:14.5px; color:var(--muted)}\n.leak .cost{margin-top:16px; font-size:13px; font-weight:700; color:var(--gold)}\n\n/* ============ CONVO (bubbles slide in/out on scroll) ============ */\n.convo{position:relative; padding:90px 0; overflow:hidden}\n.convo-in{max-width:820px; margin:0 auto; padding:0 24px; display:flex; flex-direction:column; gap:14px}\n.convo-b{\n  padding:16px 22px 12px; font-size:clamp(17px,2vw,22px); font-weight:700; line-height:1.4;\n  letter-spacing:-.01em; box-shadow:var(--shadow); width:fit-content; max-width:min(440px,88%);\n  color:var(--bubble-ink); will-change:transform,opacity;\n}\n.convo-b .meta{display:flex; justify-content:flex-end; gap:4px; font-size:11px; font-weight:600; color:color-mix(in srgb, var(--bubble-ink) 55%, transparent); margin-top:4px}\n.convo-b .ticks{color:var(--tick); letter-spacing:-.12em}\n.convo-b em{font-style:normal; color:var(--accent-deep)}\n.convo-b.plain{background:var(--bubble-in); border-radius:18px 18px 18px 6px; align-self:flex-start}\n.convo-b.green{background:var(--bubble-out); border-radius:18px 18px 6px 18px; align-self:flex-end}\n.convo-gap{height:30px}\n.convo-close{\n  margin-top:56px; text-align:center; font-size:clamp(19px,2.4vw,26px); font-weight:800;\n  opacity:0; transform:translateY(22px); transition:opacity .7s, transform .7s;\n}\n.convo-close.on{opacity:1; transform:none}\n.convo-close b{color:var(--accent-deep)}\n\n/* ============ SCROLLYTELLING ============ */\n.story{position:relative; padding:80px 0 40px}\n.story-grid{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:70px; align-items:start}\n.steps{display:flex; flex-direction:column}\n.step{min-height:92vh; display:flex; flex-direction:column; justify-content:center; padding:40px 0}\n.step-card{opacity:.22; transform:translateY(26px); transition:opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1)}\n.step.active .step-card{opacity:1; transform:none}\n.step .k{\n  display:inline-flex; align-items:center; gap:10px; font-size:12px; font-weight:800;\n  letter-spacing:.14em; text-transform:uppercase; color:var(--accent-deep); margin-bottom:16px;\n}\n.step .k i{\n  font-style:normal; width:26px; height:26px; border-radius:50%; background:var(--accent);\n  color:var(--btn-ink); display:grid; place-items:center; font-size:12px;\n}\n.step h3{font-size:clamp(27px,3vw,40px); font-weight:800; letter-spacing:-.03em; margin-bottom:16px}\n.step .body{font-size:17px; color:var(--muted); max-width:46ch}\n.tipbox{\n  margin-top:24px; max-width:430px;\n  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);\n  border-radius:0 14px 14px 0; padding:15px 18px;\n}\n.tipbox .t{font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:var(--accent-deep); margin-bottom:5px}\n.tipbox p{font-size:14px; color:var(--muted)}\n.tipbox p b{color:var(--ink)}\n.phone-col{\n  position:sticky; top:64px; height:calc(100vh - 84px);\n  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;\n}\n.phone-col .phone{height:min(580px, calc(100vh - 260px))}\n.mob-title{display:none; font-size:13px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-deep)}\n.phone-tip{\n  max-width:330px; width:100%; min-height:70px;\n  background:var(--surface); border:1px solid var(--line);\n  border-radius:14px; padding:12px 16px; box-shadow:0 10px 30px -18px rgba(0,0,0,.35);\n  font-size:13px; line-height:1.5; color:var(--muted);\n  opacity:0; transform:translateY(12px);\n  transition:opacity .5s, transform .5s cubic-bezier(.2,.8,.2,1);\n}\n.phone-tip.on{opacity:1; transform:none}\n.phone-tip .t{font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-deep); display:block; margin-bottom:3px}\n.phone-tip b{color:var(--ink)}\n.phone-ctl{display:flex; flex-direction:column; align-items:center; gap:12px}\n.dots-row{display:flex; align-items:center; gap:14px}\n.chapters{display:flex; gap:9px}\n.chapters button{\n  width:10px; height:10px; border-radius:50%; background:var(--line-strong); border:none; padding:0;\n  cursor:pointer; transition:background .3s, transform .3s;\n}\n.chapters button.on{background:var(--accent); transform:scale(1.4)}\n.arrow{\n  display:none; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line-strong);\n  background:var(--surface); color:var(--ink); font-size:18px; line-height:1; cursor:pointer;\n  align-items:center; justify-content:center; padding:0 0 2px;\n}\n.replay{\n  background:var(--surface); border:1.5px solid var(--accent); color:var(--ink);\n  font:600 13px/1 -apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif;\n  padding:9px 16px; border-radius:99px; cursor:pointer;\n  animation:glowPulse 2.6s ease-in-out infinite;\n  transition:transform .2s;\n}\n.replay:hover{transform:scale(1.05)}\n@keyframes glowPulse{\n  0%,100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}\n  50%{box-shadow:0 0 16px 3px rgba(37,211,102,.35)}\n}\n\n/* ============ WITH vs WITHOUT ============ */\n.vs{padding:110px 0; position:relative; overflow:hidden}\n.vs-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:1000px; margin:52px auto 0; position:relative; z-index:1}\n.vs-col{\n  background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:26px 24px;\n}\n.vs-col.good{border-color:color-mix(in srgb, var(--accent) 45%, transparent)}\n.vs-col h3{font-size:16px; font-weight:800; letter-spacing:.02em; padding-bottom:14px; border-bottom:1px solid var(--line); margin-bottom:6px}\n.vs-col.bad h3{color:var(--bad)}\n.vs-col.good h3{color:var(--accent-deep)}\n.vs-step{\n  display:flex; gap:13px; padding:13px 0; align-items:flex-start;\n  opacity:0; transform:translateY(14px);\n  transition:opacity .45s ease, transform .45s cubic-bezier(.2,.8,.2,1);\n}\n.vs-step.on{opacity:1; transform:none}\n.vs-step .ic{\n  width:36px; height:36px; border-radius:50%; flex:none; display:grid; place-items:center;\n  font-size:16px; background:var(--bg-soft); border:1px solid var(--line);\n}\n.vs-step .tx{font-size:14.5px; color:var(--ink); line-height:1.5}\n.vs-step .tx .say{\n  display:inline-block; background:var(--bubble-out); color:var(--bubble-ink);\n  border-radius:9px; padding:1px 9px; font-size:13px; font-weight:600; margin-left:6px;\n}\n.badge{\n  display:inline-block; margin-top:6px; font-size:10px; font-weight:800; letter-spacing:.1em;\n  text-transform:uppercase; padding:3px 9px; border-radius:6px;\n}\n.badge.you{background:color-mix(in srgb, var(--you) 15%, transparent); color:var(--you)}\n.badge.auto{background:var(--accent-soft); color:var(--accent-deep)}\n.badge.bad{background:var(--bad-soft); color:var(--bad)}\n.vs-result{\n  margin-top:12px; padding:14px 16px; border-radius:12px; font-size:14px; font-weight:700;\n  opacity:0; transform:translateY(14px); transition:opacity .5s, transform .5s;\n}\n.vs-result.on{opacity:1; transform:none}\n.vs-col.bad .vs-result{background:var(--bad-soft); color:var(--bad)}\n.vs-col.good .vs-result{background:var(--accent-soft); color:var(--accent-deep)}\n.vs-ctl{text-align:center; margin-top:30px}\n.vs-close{\n  margin-top:30px; text-align:center; font-size:clamp(17px,2vw,21px); font-weight:700; color:var(--muted);\n  opacity:0; transform:translateY(18px); transition:opacity .7s, transform .7s;\n}\n.vs-close.on{opacity:1; transform:none}\n.vs-close b{color:var(--accent-deep)}\n\n/* ============ PRICING ============ */\n.sec{padding:110px 0; position:relative; overflow:hidden}\n.sec .wrap{position:relative; z-index:1}\n.plans{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:52px; align-items:stretch}\n.plan{\n  background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:30px 26px;\n  display:flex; flex-direction:column; position:relative;\n  opacity:0; transform:translateY(40px); transition:opacity .6s, transform .6s cubic-bezier(.2,.8,.2,1);\n}\n.plan.on{opacity:1; transform:none}\n.plan.pop{border-color:var(--accent); box-shadow:0 20px 50px -25px var(--accent)}\n.plan .flag{\n  position:absolute; top:-13px; left:50%; transform:translateX(-50%);\n  background:var(--accent); color:var(--btn-ink); font-size:11px; font-weight:800;\n  letter-spacing:.1em; text-transform:uppercase; padding:5px 14px; border-radius:99px;\n}\n.plan h3{font-size:17px; font-weight:800; letter-spacing:.02em}\n.plan .price{margin:12px 0 2px; font-size:40px; font-weight:800; letter-spacing:-.03em}\n.plan .price small{font-size:15px; font-weight:600; color:var(--muted)}\n.plan .fine{font-size:12.5px; color:var(--muted); margin-bottom:20px}\n.plan ul{list-style:none; margin:0 0 26px; padding:0; display:flex; flex-direction:column; gap:11px; font-size:14px}\n.plan li{display:flex; gap:10px; align-items:flex-start; color:var(--muted)}\n.plan li::before{content:\"✓\"; color:var(--accent); font-weight:800; flex:none}\n.plan li b{color:var(--ink); font-weight:650}\n.plan .btn{margin-top:auto; justify-content:center}\n.plan-note{margin-top:26px; text-align:center; font-size:13.5px; color:var(--muted)}\n\n/* ============ SETUP / PAYBACK ============ */\n.setup-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:52px}\n.panel{\n  background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:32px 30px;\n  opacity:0; transform:translateY(36px); transition:opacity .7s, transform .7s cubic-bezier(.2,.8,.2,1);\n}\n.panel.on{opacity:1; transform:none}\n.panel h3{font-size:20px; font-weight:800; margin-bottom:20px}\n.panel ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:13px; font-size:14.5px}\n.panel li{display:flex; gap:11px; color:var(--muted)}\n.panel li::before{content:\"✓\"; color:var(--accent); font-weight:800; flex:none}\n.panel li b{color:var(--ink); font-weight:650}\n.math{display:flex; flex-direction:column; font-size:15px}\n.math .row{display:flex; justify-content:space-between; gap:16px; padding:15px 0; border-bottom:1px dashed var(--line); align-items:baseline}\n.math .row:last-of-type{border-bottom:none}\n.math .lbl{color:var(--muted); max-width:30ch}\n.math .val{font-weight:800; font-size:19px; white-space:nowrap; color:var(--gold)}\n.math .val.plain{color:var(--ink)}\n.payoff{margin-top:14px; padding:16px; background:var(--accent-soft); border-radius:14px; font-size:14px; color:var(--muted)}\n.payoff b{color:var(--accent-deep)}\n\n/* ============ FAQ ============ */\n.faq{max-width:760px; margin:52px auto 0}\n.faq details{border-bottom:1px solid var(--line)}\n.faq summary{\n  cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:20px;\n  padding:22px 4px; font-weight:700; font-size:17px; align-items:center;\n}\n.faq summary::-webkit-details-marker{display:none}\n.faq summary::after{content:\"+\"; font-size:24px; font-weight:400; color:var(--accent); transition:transform .3s; flex:none}\n.faq details[open] summary::after{transform:rotate(45deg)}\n.faq .a{padding:0 4px 24px; color:var(--muted); font-size:15.5px; max-width:65ch}\n\n/* ============ CTA / FOOTER ============ */\n.cta{padding:130px 0 120px; text-align:center; position:relative; overflow:hidden}\n.cta::before{\n  content:\"\"; position:absolute; inset:auto -20% -60% -20%; height:120%;\n  background:radial-gradient(ellipse at bottom, var(--accent-soft), transparent 65%);\n  pointer-events:none;\n}\n.cta .wrap{position:relative; z-index:1}\n.cta h2{font-size:clamp(36px,5vw,62px); font-weight:800; letter-spacing:-.035em}\n.cta h2 em{font-style:normal; color:var(--accent-deep)}\n.cta p{margin:20px auto 34px; color:var(--muted); font-size:18px; max-width:44ch}\n.wa-line{margin-top:28px; font-size:15.5px; color:var(--muted)}\n.wa-line b{color:var(--accent-deep)}\nfooter{border-top:1px solid var(--line); padding:30px 0 40px; font-size:13.5px; color:var(--muted)}\nfooter .wrap{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}\n\n/* ============ RESPONSIVE ============ */\n \">The leaks<\u002Fa>\n      <a href=\"#story\">See it work<\u002Fa>\n      <a href=\"#who\">With vs without<\u002Fa>\n      <a href=\"#pricing\">Pricing<\u002Fa>\n      <a href=\"#faq\">FAQ<\u002Fa>\n    <\u002Fdiv>\n    <button class=\"theme-btn\" id=\"themeBtn\" type=\"button\" aria-label=\"Switch between light and dark theme\">\n      <svg id=\"sunIcon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4.5\"><\u002Fcircle><path d=\"M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19\"><\u002Fpath><\u002Fsvg>\n      <svg id=\"moonIcon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"display:none\"><path d=\"M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <a class=\"btn small\" href=\"#cta\">Get started<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ============ HERO ============ -->\n<header class=\"hero\" id=\"top\">\n  <i class=\"bub plain tl-l\" data-plx=\"-0.09\" style=\"width:200px;height:120px;bottom:70px;left:28px\" aria-hidden=\"true\"><\u002Fi>\n  <i class=\"bub plain tl-l\" data-plx=\"0.06\" style=\"width:150px;height:96px;top:24%;left:36%\" aria-hidden=\"true\"><\u002Fi>\n  <i class=\"bub green tl-r\" data-plx=\"-0.05\" style=\"width:130px;height:84px;bottom:10%;right:30%\" aria-hidden=\"true\"><\u002Fi>\n  <div class=\"wrap hero-grid\">\n    <div>\n      <span class=\"eyebrow\">Runs entirely on WhatsApp<\u002Fspan>\n      <h1 style=\"margin-top:18px\">\n        Your whole front desk<br>is <em>one WhatsApp chat.<\u002Fem>\n      <\u002Fh1>\n      <p class=\"hero-sub\">\n        Built for salons and spas. Text a booking the way you'd text a friend —\n        Rebound handles the reminders, the reviews and the repeat visits, and sends you\n        one message a month showing the money it saved you. No app. No dashboard. No training.\n      <\u002Fp>\n      <div class=\"hero-ctas\">\n        <a class=\"btn\" href=\"#cta\">Start rebounding<\u002Fa>\n        <a class=\"btn ghost\" href=\"#story\">Watch it work ↓<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"hero-zero\">\n        <span><b>✓<\u002Fb> Zero apps<\u002Fspan>\n        <span><b>✓<\u002Fb> Zero dashboards<\u002Fspan>\n        <span><b>✓<\u002Fb> Zero training<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hero-phone-wrap\">\n      <div class=\"phone\" style=\"height:560px\" role=\"img\" aria-label=\"Phone showing the Rebound WhatsApp chat with a booking being confirmed\">\n        <div class=\"screen\">\n          <div class=\"wa-head\">\n            <div class=\"avatar\">\n              <svg viewBox=\"0 0 26 26\" fill=\"none\" aria-hidden=\"true\">\n                <path d=\"M4 17c0-6.5 4.5-11 9.5-11S23 10.5 23 17\" stroke=\"#06210f\" stroke-width=\"3.4\" stroke-linecap=\"round\"><\u002Fpath>\n                <path d=\"M4 17l-2.6-4.2M4 17l4.6-1.8\" stroke=\"#06210f\" stroke-width=\"3.4\" stroke-linecap=\"round\"><\u002Fpath>\n              <\u002Fsvg>\n            <\u002Fdiv>\n            <div class=\"wtitle\"><b>Rebound<\u002Fb><span>online<\u002Fspan><\u002Fdiv>\n            <div class=\"dots\" aria-hidden=\"true\">⋮<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"chat\" id=\"heroChat\"><\u002Fdiv>\n          <div class=\"wa-input\" aria-hidden=\"true\">\n            <div class=\"wa-field\"><span class=\"ph\">Message<\u002Fspan><\u002Fdiv>\n            <div class=\"wa-send\">\n              <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V22h2v-3.07A8 8 0 0 0 20 11h-2z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"hero-note\">↑ That's the entire workflow — a chat you already know how to use.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"scroll-cue\" aria-hidden=\"true\">Scroll<\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ LEAKS ============ -->\n<section class=\"leaks\" id=\"leaks\">\n  <i class=\"bub green tl-r\" data-plx=\"0.08\" style=\"width:180px;height:110px;top:50px;right:34px\" aria-hidden=\"true\"><\u002Fi>\n  <i class=\"bub plain tl-l\" data-plx=\"-0.06\" style=\"width:160px;height:98px;bottom:40px;left:30px\" aria-hidden=\"true\"><\u002Fi>\n  <div class=\"wrap\" style=\"position:relative;z-index:1\">\n    <span class=\"eyebrow\">Why your month feels lighter than your diary<\u002Fspan>\n    <h2 class=\"reveal\">Everything that leaks can rebound.<\u002Fh2>\n    <p class=\"sec-sub\">Four small leaks quietly drain every salon and spa — one empty chair, one silent customer, one missing review, one drifting regular at a time. Rebound turns each one around.<\u002Fp>\n    <div class=\"leak-row\" data-reveal=\"\">\n      <article class=\"leak\">\n        <span class=\"rb tl-l\">Rebound your <em>no-shows<\u002Fem><\u002Fspan>\n        <p>People book, then forget. The chair sits empty and the money walks out with it. Rebound reminds them at the right time — and if someone goes quiet, it warns you while there's still time to fill the gap.<\u002Fp>\n        <p class=\"cost num\">This one hole costs a typical shop ₹4,800 a week.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"leak\">\n        <span class=\"rb tl-l\">Rebound your <em>reviews<\u002Fem><\u002Fspan>\n        <p>Happy customers smile and go home quiet. Unhappy ones tell Google. Rebound flips that: happy people get a friendly nudge to tell Google — unhappy ones reach <em>you<\u002Fem> first, so you can fix it with one phone call.<\u002Fp>\n        <p class=\"cost\">Your next customer reads your reviews before your price list.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"leak\">\n        <span class=\"rb tl-l\">Rebound your <em>customers<\u002Fem><\u002Fspan>\n        <p>A haircut is due again in 3 weeks. Nobody calls, so nobody comes. Rebound remembers for you and invites each customer back exactly when they're due — before they drift.<\u002Fp>\n        <p class=\"cost\">Repeat visits are free money — no ads needed.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"leak\">\n        <span class=\"rb tl-l\">Rebound your <em>lost regulars<\u002Fem><\u002Fspan>\n        <p>Some customers drift even after a nudge — life gets busy, they try somewhere else, they forget. Rebound waits for their personal gap to pass, then sends them services worth ₹200–500 free on their next visit. Not a voucher code. Not a campaign. Just the right offer at the right moment.<\u002Fp>\n        <p class=\"cost\">This is the only money you spend on a customer you’d already lost.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CONVO (bubbles slide in/out as you scroll) ============ -->\n<section class=\"convo\" aria-label=\"What rebounds\">\n  <div class=\"convo-in\">\n    <div class=\"convo-b plain tl-l\" data-slidex=\"0.4\">She forgot her 4pm.<span class=\"meta num\">4:15 pm<\u002Fspan><\u002Fdiv>\n    <div class=\"convo-b green tl-r\" data-slidex=\"-0.4\">Reminded. She came. <em>That's a rebound.<\u002Fem><span class=\"meta num\">4:16 pm <span class=\"ticks\">✓✓<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div class=\"convo-gap\"><\u002Fdiv>\n    <div class=\"convo-b plain tl-l\" data-slidex=\"0.4\">Loved it. Told no one.<span class=\"meta num\">6:02 pm<\u002Fspan><\u002Fdiv>\n    <div class=\"convo-b green tl-r\" data-slidex=\"-0.4\">One nudge → 5★ on Google. <em>That's a rebound.<\u002Fem><span class=\"meta num\">6:04 pm <span class=\"ticks\">✓✓<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div class=\"convo-gap\"><\u002Fdiv>\n    <div class=\"convo-b plain tl-l\" data-slidex=\"0.4\">Never came back.<span class=\"meta num\">3 weeks later<\u002Fspan><\u002Fdiv>\n    <div class=\"convo-b green tl-r\" data-slidex=\"-0.4\">Invited on day 21 → rebooked. <em>That's a rebound.<\u002Fem><span class=\"meta num\">day 21 <span class=\"ticks\">✓✓<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div class=\"convo-gap\"><\u002Fdiv>\n    <div class=\"convo-b plain tl-l\" data-slidex=\"0.4\">Stopped coming in March.<span class=\"meta num\">7 weeks gone<\u002Fspan><\u002Fdiv>\n    <div class=\"convo-b green tl-r\" data-slidex=\"-0.4\">Services worth ₹400 free → she's back. <em>That's a rebound.<\u002Fem><span class=\"meta num\">week 7 <span class=\"ticks\">✓✓<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <p class=\"convo-close\" data-reveal-solo=\"\">Bookings, reviews, regulars — everything bounces back.<br><b>That's why it's called Rebound.<\u002Fb><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ SCROLLYTELLING ============ -->\n<section class=\"story\" id=\"story\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">Watch a real day, message by message<\u002Fspan>\n    <h2 class=\"reveal\" style=\"font-size:clamp(32px,4vw,50px); font-weight:800; letter-spacing:-.03em; margin:14px 0 8px\">You type. Rebound runs.<\u002Fh2>\n    <p class=\"sec-sub\">The phone below plays each moment of a salon owner's day, exactly as it happens. This is the whole product; there is nothing else to learn.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"wrap story-grid\">\n    <div class=\"steps\" id=\"steps\">\n\n      <div class=\"step\" data-ch=\"0\">\n        <div class=\"step-card\">\n          <span class=\"k\"><i>1<\u002Fi> Book in one text<\u002Fspan>\n          <h3>Type it like you'd tell a friend.<\u002Fh3>\n          <p class=\"body\">\"Priya 98200 12345 haircut kal 4pm\" — that's a complete booking. Rebound writes it down and says Got it. If something's unclear, it asks one question. It never guesses.<\u002Fp>\n          <div class=\"tipbox\">\n            <p class=\"t\">Also works<\u002Fp>\n            <p><b>Forward a customer's message, or send a 6-second voice re the free slots are.<\u002Fp>\n          <div class=\"tipbox\">\n            <p class=\"t\">How you do it<\u002Fp>\n            <p>Just type <b>TODAY<\u002Fb> or <b>WEEK<\u002Fb> in the same chat. That's the entire reporting system.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"step\" data-ch=\"4\">\n        <div class=\"step-card\">\n          <span class=\"k\"><i>5<\u002Fi> Reviews, defended<\u002Fspan>\n          <h3>Upset customers reach you before they reach Google.<\u002Fh3>\n          <p class=\"body\">Everyone gets a quiet \"how was it?\" after their visit. Happy people are invited to tell Google. Upset ones reach you first — with their number — so one phone call can fix it. If a bad review still shows up, a polite reply sits ready and waiting.<\u002Fp>\n          <div class=\"tipbox\">\n            <p class=\"t\">How you do it<\u002Fp>\n            <p>You reply <b>APPROVE<\u002Fb>. One word — the reply is posted and your reputation stays answered.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"step\" data-ch=\"5\">\n        <div class=\"step-card\">\n          <span class=\"k\"><i>6<\u002Fi> Proof, on the 1st<\u002Fspan>\n          <h3>One message. Real rupees. Every month.<\u002Fh3>\n          <p class=\"body\">On the 1st, one message lands: how many no-shows you dodged, how much money you kept, how many new reviews came in. Then the part no one else gives you: the one thing to fix next month.<\u002Fp>\n          <div class=\"tipbox\">\n            <p class=\"t\">Honest math<\u002Fp>\n            <p>Counted against <b>your own before-Rebound numbers<\u002Fb> — never inflated, never invented. Screenshot it, show it off.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"step\" data-ch=\"6\">\n        <div class=\"step-card\">\n          <span class=\"k\"><i>7<\u002Fi> Type anything. It just works.<\u002Fspan>\n mo<\u002Fsmall><\u002Fp>\n        <p class=\"fine num\">+ ₹14,999 one-time setup · unlimited appointments<\u002Fp>\n        <ul>\n          <li>Everything in Growth<\u002Fli>\n          <li><b>Up to 3 branches<\u002Fb>, one merged Proof<\u002Fli>\n          <li>Per-branch breakdown<\u002Fli>\n          <li>Quarterly strategy call<\u002Fli>\n        <\u002Ful>\n        <a class=\"btn ghost\" href=\"#cta\">Choose Pro<\u002Fa>\n      <\u002Farticle>\n    <\u002Fdiv>\n    <p class=\"plan-note\">Annual plan: <b>2 months free<\u002Fb> · No lock-in — cancel anytime and we hand you back all your reviews and your customer list. It's your data.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ SETUP ============ -->\n<section class=\"sec\" id=\"setup\" style=\"padding-top:0\">\n  <div class=\"wrap\">\n    <span class=\"eyebrow\">The one-time setup<\u002Fspan>\n    <h2>Why <span class=\"num\">₹9,999<\u002Fspan>?<\u002Fh2>\n    <p class=\"sec-sub\">Because it's real, done-for-you work — and it usually pays for itself in about a month.<\u002Fp>\n    <div class=\"setup-grid\" data-reveal=\"\">\n      <div class=\"panel\">\n        <h3>What the setup buys you<\u002Fh3>\n        <ul>\n          <li><span><b>Your own WhatsApp Business line<\u002Fb> — official, in your business name. Customers reply to \"Bloom Salon\"; they ignore unknown numbers.<\u002Fspan><\u002Fli>\n          <li><span><b>Your Google reviews connected the official way<\u002Fb> — you tap \"Allow\" once on your phone. Takes a minute.<\u002Fspan><\u002Fli>\n          <li><span><b>Your menu, prices and message style<\u002Fb> set up to sound like you.<\u002Fspan><\u002Fli>\n          <li><span><b>This week's diary moved over live on the call<\u002Fb> — reminders working from hour one.<\u002Fspan><\u002Fli>\n          <li><span><b>Your staff's numbers added<\u002Fb> — anyone at the counter can text a booking.<\u002Fspan><\u002Fli>\n          <li><span><b>Your first real bookings watched live with you<\u002Fb>, so nothing surprises you.<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"panel\">\n        <h3>The payback math<\u002Fh3>\n        <div class=\"math\">\n          <div class=\"row\"><span class=\"lbl\">A typical salon or spa loses 8 no-shows a week × ₹600<\u002Fspan><span class=\"val num\">₹4,800<small style=\"font-size:12px;font-weight:600\"> /wk<\u002Fsmall><\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"lbl\">Reminders and follow-ups typically save 40–60% of that<\u002Fspan><span class=\"val num\">₹2,000–2,900<small style=\"font-size:12px;font-weight:600\"> /wk<\u002Fsmall><\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"lbl\">Setup fee usually earned back in<\u002Fspan><span class=\"val plain num\">~4–5 weeks<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"payoff\">After that it's yours for good: the number, the messages, the review connection and the habit. <b>The setup is paid once — the leak was weekly.<\u002Fb><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FAQ ============ -->\n<section class=\"sec\" id=\"faq\" style=\"padding-top:0\">\n  <div class=\"wrap\">\n    <div style=\"text-align:center\">\n      <span class=\"eyebrow\" style=\"justify-content:center\">FAQ<\u002Fspan>\n      <h2 class=\"reveal\">Questions? Answers.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"faq\">\n      <details>\n        <summary>Do I need to install an app or learn a dashboard?<\u002Fsummary>\n        <p class=\"a\">No. Rebound has no app, no login and no dashboard. Everything — bookings in, reminders out, review alerts, your monthly report — happens inside one WhatsApp chat. If you can use WhatsApp, you already know how to use Rebound.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>How do I add a booking?<\u002Fsummary>\n        <p class=\"a\">Forward it, type it, or send a voice note — in plain, everyday language, English or Hinglish. \"Priya 98200 12345 haircut kal 4pm\" is enough. Rebound writes it down and confirms back within seconds. If anything is unclear, it asks — it never guesses.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Which number do my customers see messages from?<\u002Fsummary>\n        <p class=\"a\">Your own. During setup we create an official WhatsApp Business account in your business name. You'll need one mobile number dedicated to your business WhatsApp — if you don't have one, we help you arrange it on the setup call. A message from \"Bloom Salon\" gets answered; a message from an unknown number gets ignored.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>What happens when someone leaves a bad review?<\u002Fsummary>\n        <p class=\"a\">First, every customer gets a private \"how was your visit?\" message. If someone wasn't happy, you're told immediately so you can call and make it right. The Google invite still goes to everyone — we never pick and choose, because that's against Google's rules and can get a listing removed. If a poor review does appear, you get a polite, ready-made reply — say APPROVE and it's posted.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>What do I need to get started?<\u002Fsummary>\n        <p class=\"a\">Three things: your appointment diary (any format — even photos of a register work), your Google business listing login, and a mobile number dedicated to your business WhatsApp. We handle everything else on one setup call.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Is this only for salons?<\u002Fsummary>\n        <p class=\"a\">Salons and spas, yes — that's deliberate. Both run the same way: one diary, walk-in-adjacent bookings, and a service menu where people return every few weeks. Come-back gaps are set per service, so a haircut nudges at 3 weeks and a facial at 6. Clinics, gyms and physios are on the roadmap, not live — we'd rather do two things properly than five badly.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>Won’t people just wait for the free offer instead of booking normally?<\u002Fsummary>\n        <p class=\"a\">It doesn’t work on a schedule, so there’s nothing to wait for. It only goes out after someone’s personal gap has passed and they’re already overdue — someone who books regularly will never see one. There’s a long wait before anyone can receive a second one, and it stops entirely if two are ignored. And honestly: someone who comes back every four months for a ₹400 offer is still coming to you four times a year instead of going elsewhere.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>What happens if I go over my plan’s appointment limit?<\u002Fsummary>\n        <p class=\"a\">Nothing stops. Every reminder still goes out — we will never switch off your customer messages over a billing question. You'll get a friendly heads-up at around 80%, and we'll talk about moving you up a plan when it suits you.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>How do I know it's actually working?<\u002Fsummary>\n        <p class=\"a\">On the 1st of every month, one message lands in your chat: no-shows dodged, money kept, reviews gained, and how your rating moved against the shop you asked us to watch. Counted against your own numbers from before Rebound — one honest number, not a dashboard.<\u002Fp>\n      <\u002Fdetails>\n      <details>\n        <summary>What if I want to leave?<\u002Fsummary>\n        <p class=\"a\">Cancel anytime. We hand you back all your reviews and your customer list — it's your data, and it leaves with you.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CTA ============ -->\n<section class=\"cta\" id=\"cta\">\n  <i class=\"bub green tl-r\" data-plx=\"0.08\" style=\"width:200px;height:120px;top:40px;left:34px\" aria-hidden=\"true\"><\u002Fi>\n  <i class=\ s = dotsEl.children;\n\n  var runId = 0, current = -1, autoT = null, storyVis = false;\n  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }\n  function setField(txt){\n    waTxt.textContent = txt;\n    waPh.style.display = txt ? \"none\" : \"\";\n    micIcon.style.display = txt ? \"none\" : \"\";\n    sendIcon.style.display = txt ? \"\" : \"none\";\n    var caret = waField.querySelector(\".caret\");\n    if(txt && !caret){ caret = document.createElement(\"span\"); caret.className = \"caret\"; waField.appendChild(caret); }\n    if(!txt && caret){ caret.remove(); }\n  }\n  function addEl(cls, html){\n    var d = document.createElement(\"div\");\n    d.className = cls; d.innerHTML = html;\n    chat.appendChild(d);\n    while(chat.children.length > 14) chat.removeChild(chat.firstChild);\n    return d;\n  }\n  function nextTime(ops,k){ var n = ops[k+1]; return (n && n.t===\"send\" && n.time) ? n.time : \"\"; }\n\n  function maybeAuto(id){\n    if(id !== runId) return;\n    if(!mobileMQ.matches || !storyVis) return;\n    clearTimeout(autoT);\n    autoT = setTimeout(function(){\n      if(storyVis) show((current + 1) % CH.length);\n    }, 2100);\n  }\n\n  async function play(i){\n    var id = ++runId;\n    clearTimeout(autoT);\n    chat.innerHTML = \"\"; setField(\"\");\n    waStatus.textContent = \"online\";\n    var ch = CH[i];\n    mobTitle.textContent = (i+1) + \" / \" + CH.length + \" — \" + ch.title;\n    tipEl.classList.remove(\"on\");\n    tipEl.innerHTML = ch.tip;\n    setTimeout(function(){ if(id===runId) tipEl.classList.add(\"on\"); }, reduced?0:500);\n\n    for(var k=0; k<ch.ops.length; k++){\n      if(id !== runId) return;\n      var op = ch.ops[k];\n\n      if(reduced){\n        if(op.t===\"day\") addEl(\"daychip\", op.x);\n        else if(op.t===\"in\") addEl(\"bubble in\", op.x);\n        else if(op.t===\"static\") addEl(\"bubble in\", op.html);\n        else if(op.t===\"type\"){ addEl(\"bubble out\", op.x + TK(nextTime(ch.ops,k))); k++; }\n        continue;\n      }\n\n      switch(op.t){\n        case \"static\":\n          addEl(\"bubble in\", op.html);\n          await sleep(400);\n          break;\n        case \"day\":\n          addEl(\"daychip\", op.x);\n          await sleep(600);\n          break;\n        case \"wait\":\n          await sleep(op.ms || 600);\n          break;\n        case \"type\":\n          setField(\"\");\n          await sleep(350);\n          for(var c=1; c<=op.x.length; c++){\n            if(id !== runId) return;\n            setField(op.x.slice(0,c));\n            await sleep(op.x.length > 20 ? 26 : 46);\n          }\n          await sleep(320);\n          break;\n        case \"send\":\n          if(id !== runId) return;\n          waSend.classList.add(\"pulse\");\n          setTimeout(function(){ waSend.classList.remove(\"pulse\"); }, 240);\n          addEl(\"bubble out\", waTxt.textContent + TK(op.time || \"\"));\n          setField(\"\");\n          await sleep(650);\n          break;\n        case \"in\":\n          waStatus.textContent = \"typing…\";\n          var tb = addEl(\"bubble in\", '<span class=\"typing-b\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>');\n          await sleep(op.ms || 1100);\n          if(id !== runId) return;\n          tb.remove();\n          waStatus.textContent = \"online\";\n          addEl(\"bubble in\", op.x);\n          await sleep(700);\n          break;\n      }\n    }\n    maybeAuto(id);\n  }\n\n  function show(i){\n    if(i === current) return;\n    current = i;\n    play(i);\n    for(var k=0;k<dots.length;k++) dots[k].classList.toggle(\"on\", k===i);\n  }\n  function userNav(i){\n    clearTimeout(autoT);\n    if(i === current){ current = -1; }\n    show(((i % CH.length) + CH.length) % CH.length);\n  }\n  document.getElementById(\"prevBtn\").addEventListener(\"click\", function(){ userNav(current - 1); });\n  document.getElementById(\"nextBtn\").addEventListener(\"click\", function(){ userNav(current + 1); });\n  document.getElementById(\"replayBtn\").addEventListener(\"click\", function(){ userNav(current); });\n\n  /* desktop: scroll drives the chapters */\n  var steps = document.querySelectorAll(\".step\");\n  var stepIO = new IntersectionObserver(function(es){\n    es.forEach(function(e){\n      var i = +e.target.dataset.ch;\n      if(e.isIntersecting){ e.target.classList.add(\"active\"); show(i); }\n      else { e.target.classList.remove(\"active\"); }\n    });\n  }, {rootMargin:\"-40% 0px -40% 0px\"});\n  steps.forEach(function(s){ stepIO.observe(s); });\n\n  /* mobile: auto-advance while the demo is on screen */\n  var storyIO = new IntersectionObserver(function(es){\n    es.forEach(function(e){\n      storyVis = e.isIntersecting;\n      if(storyVis && mobileMQ.matches){ maybeAuto(runId); }\n      else if(!storyVis){ clearTimeout(autoT); }\n    });\n  }, {threshold:.2});\n  storyIO.observe(document.querySelector(\".phone-col\"));\n\n  show(0);\n  steps[0].classList.add(\"active\");\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
