<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/reviewsaathi-logo.svg" type="image/svg+xml">
<link rel="icon" href="/assets/reviewsaathi-favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/reviewsaathi-logo-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send a ReviewSaathi report</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
header{padding:14px 0;border-bottom:1px solid var(--line)}
.wrap{max-width:640px}
main{padding:22px 0 70px}
.step{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:16px;margin:14px 0}
.step b{display:block;font-size:20px;margin-bottom:8px}
.big{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:12px;font:700 18px var(--f-body);background:var(--accent);color:var(--accent-ink);text-decoration:none;cursor:pointer;margin-top:8px}
.big.alt{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.big:disabled{opacity:.55}
.msg{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:16px;margin:8px 0}
.note{font-size:15px;color:var(--muted);margin:8px 0 0}
details{margin-top:8px}summary{cursor:pointer;font-weight:700;padding:8px 0}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:14px;font-weight:600}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="./"><img src="/assets/reviewsaathi-logo.svg" alt="" width="34" height="34" style="border-radius:8px;display:block">ReviewSaathi</a></div></header>
<main><div class="wrap" id="root"><p class="muted">Loading...</p></div></main>

<script src="sendkit.js"></script>
<script>
(function(){
  var API = 'https://aiservices-snehoo.duckdns.org/webhook/reviewsaathi-admin';
  var root = document.getElementById('root');
  var key = ''; try { key = localStorage.getItem('rs_key') || ''; } catch(e){}
  var id = new URLSearchParams(location.search).get('id') || '';

  function h(tag, attrs){ var el = document.createElement(tag); attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){ if (k === 'text') el.textContent = attrs[k]; else if (k === 'class') el.className = attrs[k]; else if (k.slice(0,2) === 'on') el.addEventListener(k.slice(2), attrs[k]); else el.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null) continue; el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); }
    return el; }
  function fail(m){ root.replaceChildren(h('div', { class: 'err', text: m })); }
  if (!key) return fail('Open the admin page on this phone first and type your key. Then come back to this page.');
  if (!id) return fail('This link has no report in it.');

  var u = new URL(API); u.searchParams.set('key', key); u.searchParams.set('what', 'report'); u.searchParams.set('id', id);
  fetch(u.toString()).then(function(r){ if (r.status === 401) throw new Error('key'); return r.json(); }).then(function(d){
    var r = d.report; if (!r) return fail('That report was not found. It may have been deleted.');
    var stamp = ''; try { stamp = new Date(r.created_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch(e){}
    var kit = h('div', {});
    root.replaceChildren(
      h('h1', { style: 'font-size:28px', text: 'Send to ' + r.shop }),
      h('p', { class: 'muted', style: 'margin-top:4px', text: 'Report made ' + stamp + '. It is saved, so you do not need to make it again.' }),
      kit);
    window.RSKit.mount(kit, r, { showMessages: true });
  }).catch(function(e){ fail(e && e.message === 'key' ? 'That key was not accepted. Open the admin page and type your key again.' : 'Could not load this report. Please try again.'); });
})();
</script>
</body>
</html>
